name: Test

on:
  push:
    branches: [main]
  pull_request: # every pull request, also one into another branch
  schedule:
    - cron: "0 5 1,15 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Read the test environments from [[tool.hatch.envs.hatch-test.matrix]] in pyproject.toml,
  # so CI runs the same environments as `hatch test` locally. Follows the scverse cookiecutter template.
  get-environments:
    runs-on: ubuntu-slim
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
      - &clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Get test environments
        id: get-envs
        run: |
          ENVS_JSON=$(uvx hatch env show --json | jq -c 'to_entries
            | map(
                select(.key | startswith("hatch-test"))
                | {
                    name: .key,
                    label: (if (.key | contains("pre")) then .key + " (PRE-RELEASE DEPENDENCIES)" else .key end),
                    python: .value.python
                  }
              )')
          echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT

  test:
    needs: get-environments
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}
    name: ${{ matrix.env.label }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(matrix.env.name, 'pre') }} # a pre-release failure warns but does not block
    env:
      UV_PYTHON: ${{ matrix.env.python }}
      # CPU-only torch wheels for the ml extra
      UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
      UV_INDEX_STRATEGY: unsafe-best-match
    steps:
      - *clone
      - *setup-uv
      - name: Create hatch environment
        run: uvx hatch env create ${{ matrix.env.name }}
      - name: List installed package versions
        run: uvx hatch run ${{ matrix.env.name }}:uv pip list
      - name: Run tests
        env:
          MPLBACKEND: agg
        run: uvx hatch run ${{ matrix.env.name }}:run-cov -v --color=yes --report-log=pytest-log.jsonl
      - name: Report coverage
        run: |
          test -f .coverage || uvx hatch run ${{ matrix.env.name }}:cov-combine
          uvx hatch run ${{ matrix.env.name }}:cov-report
      - name: Mark a scheduled run that failed before the tests started, which leaves no test log
        if: failure() && github.event_name == 'schedule' && hashFiles('pytest-log.jsonl') == ''
        run: touch no-test-log
      - name: Upload the test log of a failed scheduled run
        if: failure() && github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-log-${{ matrix.env.name }}
          path: |
            pytest-log.jsonl
            no-test-log

  # One required check for branch protection, independent of how many environments exist.
  check:
    name: Tests pass in all hatch environments
    if: always()
    needs: [get-environments, test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

  # Open or update one GitHub issue per environment that failed in a scheduled run, as xarray does.
  # A separate job, so the tests (which run nightly dependencies) never get a token that can write issues.
  create-issue:
    name: Report failed scheduled run
    needs: [get-environments, test]
    if: always() && github.event_name == 'schedule' && github.repository_owner == 'theislab'
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Download the test log, which exists only if this environment failed
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pytest-log-${{ matrix.env.name }}
          path: logs/
      - name: Open or update the issue
        if: steps.download.outcome == 'success' && hashFiles('logs/pytest-log.jsonl') != ''
        uses: scientific-python/issue-from-pytest-log-action@35b4e0a9e06f8e7e261778289cf4b968b722662d # v1.6.2
        with:
          log-path: logs/pytest-log.jsonl
          issue-title: "Scheduled CI failed: ${{ matrix.env.name }}"
      - name: Open an issue when the run failed before the tests started
        if: steps.download.outcome == 'success' && hashFiles('logs/pytest-log.jsonl') == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled CI failed before the tests: ${{ matrix.env.name }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The environment could not be created or the tests did not start. See $RUN_URL."
          fi
