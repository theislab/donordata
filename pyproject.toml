[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "donordata"
description = "Single-cell data organized across donors, samples and cells"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Lucas Arnoldt", email = "lucas.arnoldt@helmholtz-munich.de" },
  { name = "Jan Engelmann", email = "jan.engelmann@helmholtz-munich.de" },
  { name = "Eva Holtkamp", email = "eva.holtkamp@helmholtz-munich.de" },
]
authors = [
  { name = "Lucas Arnoldt" },
  { name = "Jan Engelmann" },
  { name = "Eva Holtkamp" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.12.2",
  "dask[array]>=2024.8",
  "h5py>=3.10",
  "mudata>=0.3.1",
  "numpy>=1.26",
  "pandas>=2.2",
  "rich>=13",
  "scipy>=1.12",
  "zarr>=3.1",
]

optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "linkify-it-py",
  "matplotlib",
  "myst-nb>=1.1",
  "setuptools",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx>=4",
  "sphinxext-opengraph",
]
optional-dependencies.ehr = [
  "ehrdata>=0.1; python_version>='3.12'",
]
optional-dependencies.ml = [
  "torch>=2.2",
]
optional-dependencies.test = [
  "coverage",
  "ehrdata>=0.1; python_version>='3.12'",
  "pytest",
]
optional-dependencies.tutorials = [
  "ehrdata>=0.1; python_version>='3.12'",
  "matplotlib",
  "scanpy",
  "scikit-learn",
  "seaborn",
]
urls.Documentation = "https://donordata.readthedocs.io"
urls.Homepage = "https://github.com/theislab/donordata"
urls.Source = "https://github.com/theislab/donordata"

[tool.hatch.version]
path = "src/donordata/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [ "src/donordata" ]

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
extra-features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

[tool.hatch.envs.hatch-test]
features = [ "test", "ml" ]
extra-dependencies = [ "pytest-reportlog" ] # CI turns the log of a failed scheduled run into a GitHub issue

# stable: every supported Python with current releases.
# min: lowest Python with the lower bounds of pyproject.toml, pinned by ci/min_deps.py.
# pre: highest Python with pre-releases and nightly numpy, pandas and scipy.
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "stable" ]
python = [ "3.11", "3.12", "3.13", "3.14" ]

[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "min" ]
python = [ "3.11" ]

[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "pre" ]
python = [ "3.14" ]

[tool.hatch.envs.hatch-test.overrides]
matrix.deps.env-vars = [
  { if = [ "min" ], key = "UV_CONSTRAINT", value = "ci/min-deps.txt" },
  { if = [ "pre" ], key = "UV_PRERELEASE", value = "allow" },
]
matrix.deps.pre-install-commands = [
  { if = [ "min" ], value = "python ci/min_deps.py" },
]
matrix.deps.post-install-commands = [
  { if = [ "pre" ], value = "uv pip install --pre --upgrade --no-deps --index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple numpy pandas scipy" },
]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.select = [
  "B",
  "BLE",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "RUF100",
  "TID",
  "UP",
  "W",
]
lint.ignore = [
  "B008",
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D400",
  "D401",
  "E501",
  "E731",
  "E741",
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "B018", "D", "E402", "I" ]
lint.per-file-ignores."tests/*" = [ "D", "E402" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib",
]
# Fail on deprecations that donordata's own code triggers, so a coming pandas or numpy change shows up in CI first.
filterwarnings = [
  "error::DeprecationWarning:donordata",
  "error::FutureWarning:donordata",
]

[tool.coverage.run]
source = [ "donordata" ]
omit = [
  "**/test_*.py",
]
