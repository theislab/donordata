[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "donordata"
description = "Single-cell data organized across donors, samples and cells"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Lucas Arnoldt", email = "lucas.arnoldt@helmholtz-munich.de" },
  { name = "Jan Engelmann", email = "jan.engelmann@helmholtz-munich.de" },
  { name = "Eva Holtkamp", email = "eva.holtkamp@helmholtz-munich.de" },
]
authors = [
  { name = "Lucas Arnoldt" },
  { name = "Jan Engelmann" },
  { name = "Eva Holtkamp" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "anndata>=0.10",
  "dask[array]",
  "h5py",
  "mudata",
  "numpy",
  "pandas",
  "rich",
  "scipy",
  "zarr>=3",
]

optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "linkify-it-py",
  "myst-nb>=1.1",
  "setuptools",
  "sphinx>=4",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinxext-opengraph",
]
optional-dependencies.ehr = [
  "ehrdata",
]
optional-dependencies.ml = [
  "torch",
]
optional-dependencies.spatial = [
  "spatialdata",
]
optional-dependencies.test = [
  "coverage",
  "ehrdata",
  "pytest",
]
optional-dependencies.tutorials = [
  "ehrdata",
  "matplotlib",
  "scanpy",
  "scikit-learn",
  "seaborn",
]
urls.Homepage = "https://github.com/theislab/donordata"
urls.Source = "https://github.com/theislab/donordata"

[tool.hatch.version]
path = "src/donordata/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [ "src/donordata" ]

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
extra-features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

[tool.hatch.envs.hatch-test]
features = [ "test", "ml" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.select = [
  "B",
  "BLE",
  "C4",
  "D",
  "E",
  "F",
  "I",
  "RUF100",
  "TID",
  "UP",
  "W",
]
lint.ignore = [
  "B008",
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D400",
  "D401",
  "E501",
  "E731",
  "E741",
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "B018", "D", "E402", "I" ]
lint.per-file-ignores."tests/*" = [ "D", "E402" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib",
]

[tool.coverage.run]
source = [ "donordata" ]
omit = [
  "**/test_*.py",
]
